name: Run starred_ml

on:
  workflow_dispatch:
  schedule:
    - cron: 30 0 * * 0

permissions:
  pull-requests: write
  contents: write
  actions: write # required for Actions cache when permissions are restricted

jobs:
  starred_ml:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout tree
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}

      # Full switch (compiler + starred_ml). setup-ocaml's own opam cache
      # only snapshots the bare compiler switch.
      - name: Cache opam switch
        uses: actions/cache@v4
        with:
          path: |
            ~/.opam
            _opam
          key: opam-5.5.1-starred_ml-0.0.9-${{ runner.os }}-ubuntu-22.04

      - name: Set-up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.5.1"
          cache: false
          dune-cache: true

      - name: Install starred_ml
        run: opam install starred_ml.0.0.9

      - name: Generate awesome README
        env:
          TOKEN: ${{ secrets.TOKEN }} # This token is a PAT with starred read access
        run: opam exec -- starred_ml render > README.md
        working-directory: ${{ github.event.repository.name }}

      - uses: peter-evans/create-pull-request@v7
        with:
          commit-message: ${{ github.event.repository.updated_at}} starred_ml update
          title: ${{ github.run_number }} starred_ml update
          branch-suffix: short-commit-hash
          path: ${{ github.event.repository.name }}
